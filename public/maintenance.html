<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>We'll be right back — Farmer's Dairy</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Farmer's Dairy is currently offline for scheduled maintenance. We'll be back shortly." />
    <link
      rel="icon"
      type="image/png"
      href="https://raw.githubusercontent.com/dineshkumar-ramachandran/farmers-dairy/farmers-dairy/public/images/farmers-dairy-logo.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Plus+Jakarta+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --cream: #fbebd1;
        --cream-deep: #f5dbae;
        --green: #1c4610;
        --green-deep: #0f2e0a;
        --butter: #f9bb6a;
        --butter-deep: #e89a47;
        --text: #3b4e32;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        background: var(--cream);
        color: var(--text);
        display: grid;
        place-items: center;
        padding: 2rem;
        overflow-x: hidden;
      }
      .blob {
        position: fixed;
        border-radius: 42% 58% 61% 39% / 45% 41% 59% 55%;
        filter: blur(56px);
        pointer-events: none;
        z-index: 0;
        animation: drift 22s ease-in-out infinite;
      }
      .blob.butter { top: -6rem; right: -6rem; width: 24rem; height: 24rem; background: rgba(249, 187, 106, 0.35); }
      .blob.mint   { bottom: -8rem; left: -8rem; width: 26rem; height: 26rem; background: rgba(45, 96, 20, 0.18); animation-duration: 30s; animation-direction: reverse; }
      @keyframes drift {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        33%      { transform: translate3d(3%, -4%, 0) rotate(6deg); }
        66%      { transform: translate3d(-4%, 3%, 0) rotate(-4deg); }
      }
      .card {
        position: relative;
        z-index: 1;
        max-width: 560px;
        text-align: center;
        padding: 3rem 2rem;
      }
      .logo {
        width: 96px;
        height: auto;
        margin: 0 auto 1.75rem;
        display: block;
      }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        color: var(--green);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.28em;
        text-transform: uppercase;
      }
      .eyebrow::before {
        content: "";
        width: 2rem;
        height: 2px;
        background: var(--butter);
        border-radius: 2px;
      }
      h1 {
        font-family: "Bricolage Grotesque", system-ui, sans-serif;
        color: var(--green-deep);
        font-size: clamp(2.4rem, 6vw, 3.6rem);
        font-weight: 800;
        letter-spacing: -0.02em;
        line-height: 1.05;
        margin: 1.25rem 0 1rem;
      }
      h1 em {
        font-style: italic;
        background: linear-gradient(115deg, var(--green) 0%, #2d6014 55%, var(--butter-deep) 130%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      p.lead {
        font-size: 1.05rem;
        line-height: 1.65;
        max-width: 44ch;
        margin: 0 auto 2rem;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        justify-content: center;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        min-height: 44px;
        padding: 0 1.5rem;
        border-radius: 9999px;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.14em;
        text-decoration: none;
        transition: transform 220ms cubic-bezier(0.16, 1, 0.3, 1),
                    background 220ms cubic-bezier(0.16, 1, 0.3, 1),
                    box-shadow 220ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .btn-primary {
        background: var(--green);
        color: var(--cream);
        box-shadow: 0 2px 0 0 var(--green-deep),
                    0 12px 24px -14px rgba(28, 70, 16, 0.7);
      }
      .btn-primary:hover { background: var(--green-deep); transform: translateY(-2px); }
      .btn-secondary {
        border: 1.5px solid var(--green);
        color: var(--green);
        background: transparent;
      }
      .btn-secondary:hover { background: var(--green); color: var(--cream); transform: translateY(-2px); }
      .rule {
        margin: 2.5rem auto 1.25rem;
        max-width: 6rem;
        border-top: 1px solid rgba(15, 46, 10, 0.14);
      }
      .contact {
        font-size: 0.85rem;
        color: rgba(59, 78, 50, 0.85);
      }
      .contact a { color: var(--green-deep); font-weight: 600; text-decoration: none; }
      .contact a:hover { color: var(--butter-deep); }
      @media (prefers-reduced-motion: reduce) {
        .blob { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="blob butter" aria-hidden="true"></div>
    <div class="blob mint" aria-hidden="true"></div>

    <main class="card" role="main">
      <img
        class="logo"
        src="https://raw.githubusercontent.com/dineshkumar-ramachandran/farmers-dairy/farmers-dairy/public/images/farmers-dairy-logo.png"
        alt="Farmer's Dairy"
      />
      <span class="eyebrow">Scheduled Maintenance</span>
      <h1>
        We'll be back <em>very soon</em>.
      </h1>
      <p class="lead">
        Our team is polishing a few things behind the scenes so your daily
        milk keeps arriving fresh. Please check back in a little while.
      </p>
      <div class="actions">
        <a class="btn btn-primary" href="https://wa.me/919363778989?text=Hi%20Farmer%27s%20Dairy">
          Chat on WhatsApp
        </a>
        <a class="btn btn-secondary" href="tel:9363778989">
          Call 93637 78989
        </a>
      </div>
      <hr class="rule" aria-hidden="true" />
      <p class="contact">
        Or write to
        <a href="mailto:info@farmersdairy.com">info@farmersdairy.com</a>
        · Hosur, Tamil Nadu
      </p>
    </main>
  </body>
</html>
